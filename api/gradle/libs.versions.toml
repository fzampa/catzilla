[versions]
springdoc = "3.2.1"
errorprone = "2.53.0"
archunit = "1.5.1"
palantir-java-format = "2.103.0"

[libraries]
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version = "4.2.0" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
spotless = { id = "com.diffplug.spotless", version = "8.12.0" }
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
