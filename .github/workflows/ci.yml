name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run doctor
      - run: npm run build:web
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: mobile-web
          path: mobile/dist
          retention-days: 14

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # build = spotlessCheck + Error Prone compile + unit, contract, architecture
      # and Testcontainers integration tests (Docker is available on GitHub runners).
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: |
            api/build/reports/tests
            api/build/reports/jacoco
          retention-days: 14

  api-image:
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/catzilla-api:main
            ghcr.io/${{ github.repository_owner }}/catzilla-api:sha-${{ github.sha }}

  # Single required status check for branch protection. Passes when every
  # job either succeeded or was skipped because its paths did not change.
  ci-ok:
    if: always()
    needs: [changes, mobile, api]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed or were skipped."
